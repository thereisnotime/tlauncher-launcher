name: Python Lint

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest and newest supported versions
        python: ["3.10", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        just install-dev

    - name: Check code formatting
      run: |
        just format-check

    - name: Run linter
      run: |
        just lint

    - name: Run tests
      run: |
        just test

    - name: Type check with mypy
      run: |
        .venv/bin/mypy --ignore-missing-imports --no-strict-optional cli.py gui.py minecraft.py core/ ui/
